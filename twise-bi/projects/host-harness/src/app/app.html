<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="30 145 1320 830" role="presentation">
          <polygon points="46,162 1335,162 1172,326 208,326" fill="#59585D" />
          <polygon points="200,363 678,363 678,775 498,960 499,519 45,519" fill="#2841A3" />
          <polygon points="707,362 1176,362 1330,518 886,518 886,957 707,775" fill="#E38200" />
        </svg>
      </span>
      @if (!collapsed()) {
        <span class="brand-text"><strong>AL TASNIM</strong><small>Tasnim Maps</small></span>
      }
    </div>
    <nav class="menu">
      @for (item of nav; track item.path) {
        <a class="menu-link" [routerLink]="item.path" routerLinkActive="active" [attr.title]="collapsed() ? item.label : null">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
          @if (!collapsed()) {
            <span>{{ item.label }}</span>
          } @else {
            <span class="sr-only">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="navbar">
      <button type="button" class="toggle" [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'" (click)="collapsed.set(!collapsed())">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <span class="crumb">Tasnim Maps · BI module harness</span>
      <span class="spacer"></span>
      <span class="sync">Host app — not TWise production</span>
    </header>

    <div class="content">
      <main class="outlet">
        <router-outlet />
      </main>
      <footer class="footer">© 2026 Al Tasnim · @tasnim/bi harness</footer>
    </div>
  </div>
</div>
