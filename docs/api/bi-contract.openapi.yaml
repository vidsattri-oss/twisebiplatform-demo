openapi: 3.1.0
info:
  title: Tasnim BI contract
  version: 2.0.0
  description: |
    The one contract between the @tasnim/bi Angular library and a backend.
    The Node reference implementation lives in query-builder-prototype/bi/;
    TWise's .NET tenant API implements the same contract and runs the same
    contract tests (query-builder-prototype/bi/test/*-api.test.js and contract.test.js).

    Rules every implementation must keep (specs docs/specs/twise-bi-module.md
    and docs/specs/twise-bi-requirements-v2.md):
    - I1: identifiers are resolved from the semantic model; never interpolate a
      client string into SQL. Database connectors match table names against the
      source's INFORMATION_SCHEMA before quoting them.
    - I2: filter values are bound parameters of the column's dataType; a value
      that doesn't fit the type is a 400.
    - Filters targeting a table the query can't reach through many-to-one
      relationships are skipped and reported in `ignoredFilters` (Power BI
      single-direction cross-filtering).
    - I8: plug-in code is stored and returned as JSON text, never served or run
      as a script by the server; clients run it only in a sandboxed iframe.
    - I9: outbound requests go only to allow-listed hosts (private addresses
      refused unless listed exactly); connection secrets are never returned.
    - I10: dataset filters apply to every /query, /rows and /values request on their model.
    - I11: formula text literals, format patterns and "now" are bound parameters.
servers:
  - url: /api/bi
security:
  - bearerAuth: []

paths:
  /models:
    get:
      summary: List semantic models (one per registered connection)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelSummary' } } } } }
  /models/{modelId}:
    get:
      summary: Tables, typed columns, relationships and measures
      parameters: [{ $ref: '#/components/parameters/ModelId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SemanticModel' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /models/{modelId}/measures:
    post:
      summary: Create a user measure (validated before saving)
      parameters: [{ $ref: '#/components/parameters/ModelId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeasureInput' } } } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Measure' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /models/{modelId}/measures/{measureId}:
    delete:
      summary: Delete a user measure
      parameters: [{ $ref: '#/components/parameters/ModelId' }, { name: measureId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /models/{modelId}/columns:
    post:
      summary: Create a calculated column (row formula, validated before saving)
      parameters: [{ $ref: '#/components/parameters/ModelId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeasureInput' } } } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Column' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /models/{modelId}/columns/{columnId}:
    delete:
      summary: Delete a user calculated column
      parameters: [{ $ref: '#/components/parameters/ModelId' }, { name: columnId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /models/{modelId}/dataset-filters:
    parameters: [{ $ref: '#/components/parameters/ModelId' }]
    get:
      summary: Filters applied to every query on the model (I10)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BiFilter' } } } } }
    put:
      summary: Replace the model's dataset filters (validated against the model)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [filters], properties: { filters: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/BiFilter' } } } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BiFilter' } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /measures/validate:
    post:
      summary: Parse and compile a measure or calculated column formula without saving
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeasureValidateRequest' } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/MeasureValidateResult' } } } }
  /measures/preview:
    post:
      summary: Evaluate a formula without saving — a measure over the whole table, or a column's first rows
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeasureValidateRequest' } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/ExpressionPreview' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /query:
    post:
      summary: Aggregate query for a visual, with optional highlight
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VisualQuery' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /rows:
    post:
      summary: Detail rows (table visual, See records) with a total count
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RowsRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RowsResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /values:
    post:
      summary: Slicer values for one column under the current filters
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValuesRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ValuesResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /reports:
    get:
      summary: List reports
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportSummary' } } } } }
    post:
      summary: Create a report (definition validated against its model)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportInput' } } } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /reports/{reportId}:
    parameters: [{ name: reportId, in: path, required: true, schema: { type: integer } }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /connections:
    get:
      summary: Registered connections (same shape as model summaries)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModelSummary' } } } } }
    post:
      summary: Create a typed connection (S1). sqlite registers an existing file; other types get their own store.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionInput' } } } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /connections/types:
    get:
      summary: Connection types, and whether each database driver is installed on the server
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectionTypeInfo' } } } } }
  /connections/available-files:
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /connections/{connectionId}:
    parameters: [{ name: connectionId, in: path, required: true, schema: { type: integer } }]
    put:
      summary: Change name or settings (merged); secret replaces, null removes, omitted keeps
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, settings: { type: object, additionalProperties: true }, secret: { type: [string, 'null'] } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Error' }
  /connections/{connectionId}/test:
    post:
      summary: Reach the source without writing; reports what is still needed
      parameters: [{ name: connectionId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, required: [ok, message], properties: { ok: { type: boolean }, message: { type: string }, needs: { type: string }, tables: { type: array, items: { type: string } } } } } } }
  /connections/{connectionId}/refresh:
    post:
      summary: Pull or copy the source into the connection's store, replacing previous rows (S3, S4)
      parameters: [{ name: connectionId, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Refreshed, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, rows: { type: integer }, tables: { type: array, items: { type: string } }, empty: { type: array, items: { type: string } }, refreshedAt: { type: string, format: date-time } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /ingest/csv:
    post:
      summary: Load CSV text into a CSV, Excel or SQLite connection (default "CSV uploads")
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tableName, csv], properties: { connectionId: { type: integer }, tableName: { type: string }, csv: { type: string }, mode: { type: string, enum: [append, replace], default: replace }, dryRun: { type: boolean } } } } } }
      responses:
        '200': { description: Plan or result, content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /ingest/excel:
    post:
      summary: Load an .xlsx workbook (base64), one table per sheet (default "Excel uploads")
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fileName, fileBase64], properties: { connectionId: { type: integer }, fileName: { type: string }, fileBase64: { type: string }, sheets: { type: array, items: { type: string } }, mode: { type: string, enum: [append, replace], default: replace }, dryRun: { type: boolean } } } } } }
      responses:
        '200': { description: Plan or result, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/IngestResult' }, { type: object, properties: { sheets: { type: array, items: { type: string } }, emptySheets: { type: array, items: { type: string } } } }] } } } }
        '400': { $ref: '#/components/responses/Error' }
  /ingest/json-column:
    post:
      summary: Flatten a JSON text column into tables linked to each source row (J1, J2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, table, column, keyColumn]
              properties:
                connectionId: { type: integer }
                table: { type: string }
                column: { type: string, description: The JSON text column }
                keyColumn: { type: string, description: Unique row id the flattened rows reference }
                keys: { type: array, maxItems: 200, items: { type: string }, description: 'Key paths to keep, e.g. employee_ids, metrics.actual_hours' }
                mode: { type: string, enum: [append, replace], default: replace }
                dryRun: { type: boolean }
      responses:
        '200': { description: Plan or result, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/IngestResult' }, { type: object, properties: { sourceRows: { type: integer }, skipped: { type: integer }, availableKeys: { type: array, items: { type: string } }, missingKeys: { type: array, items: { type: string } } } }] } } } }
        '400': { $ref: '#/components/responses/Error' }
  /visuals:
    get:
      summary: Installed plug-in visuals (manifests only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PluginVisual' } } } } }
    post:
      summary: Import a plug-in (manifest + JavaScript text), validated before saving
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [manifest, code], properties: { manifest: { $ref: '#/components/schemas/PluginManifest' }, code: { type: string, maxLength: 204800 } } } } } }
      responses:
        '200': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/PluginVisual' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /visuals/catalog:
    get:
      summary: Bundled sample plug-ins, with whether each is installed
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { allOf: [{ $ref: '#/components/schemas/PluginManifest' }, { type: object, properties: { installed: { type: boolean } } }] } } } } }
  /visuals/catalog/{type}:
    get:
      summary: A catalog sample's manifest and code, to start a custom visual from
      parameters: [{ name: type, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { manifest: { $ref: '#/components/schemas/PluginManifest' }, code: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /visuals/catalog/{type}/install:
    post:
      parameters: [{ name: type, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Installed, content: { application/json: { schema: { $ref: '#/components/schemas/PluginVisual' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /visuals/{type}/code:
    get:
      summary: Plug-in JavaScript as JSON text (never served as a script, I8)
      parameters: [{ name: type, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /visuals/{type}:
    delete:
      parameters: [{ name: type, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /ingest/json:
    post:
      summary: Flatten JSON into tables (records → columns, lists → child rows)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IngestRequest' } } } }
      responses:
        '200': { description: Plan (and written when dryRun is false), content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } } }
        '400': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ModelId: { name: modelId, in: path, required: true, schema: { type: integer } }
  responses:
    Ok: { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: What went wrong and how to fix it }
        position: { type: integer, description: Character offset for expression errors }

    DataType: { type: string, enum: [text, integer, number, date, datetime, boolean], description: 'datetime values are "YYYY-MM-DD HH:MM:SS" (UTC)' }
    Scalar: { oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: 'null' }] }
    ConnectionType: { type: string, enum: [sqlite, csv, excel, rest, googleSheet, sap, sqlServer, postgres] }

    ModelSummary:
      type: object
      required: [id, name, fileName, status, tableCount]
      properties:
        id: { type: integer }
        name: { type: string }
        fileName: { type: string }
        driver: { type: string }
        status: { type: string, enum: [connected, error] }
        tableCount: { type: integer }
        error: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/ConnectionType' }
        typeLabel: { type: string }
        kind: { type: string, enum: [file, upload, pull, database] }
        settings: { type: object, additionalProperties: true, description: Non-secret settings only }
        hasSecret: { type: boolean, description: The secret itself is never returned }
        state: { type: string, enum: [ready, needs-setup, needs-refresh, needs-upload, refresh-failed] }
        needs: { type: [string, 'null'], description: 'e.g. "Needs SQL Server: password, tables to copy (schema.table)."' }
        lastRefresh: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        rowCount: { type: [integer, 'null'] }
    ConnectionTypeInfo:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ConnectionType' }
        label: { type: string }
        kind: { type: string, enum: [file, upload, pull, database] }
        system: { type: string }
        driver: { type: string }
        driverInstalled: { type: boolean }
    ConnectionInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/ConnectionType' }
        fileName: { type: string, description: sqlite only — a file in the server's connections folder }
        settings:
          type: object
          additionalProperties: true
          description: |
            rest: url, recordsPath, tableName, refreshMinutes. googleSheet: url, format (csv|xlsx|json), tableName, refreshMinutes.
            sap: serviceUrl, entitySet, user, top, refreshMinutes. sqlServer / postgres: host, port, database, user,
            tables (schema.table list), maxRows, encrypt, trustServerCertificate, refreshMinutes.
        secret: { type: string, description: 'Token or password; stored encrypted, never returned' }
    ExpressionPreview:
      type: object
      required: [dataType]
      properties:
        dataType: { $ref: '#/components/schemas/DataType' }
        value: { $ref: '#/components/schemas/Scalar' }
        sample: { type: object, properties: { columns: { type: array, items: { type: string } }, rows: { type: array, items: { type: array, items: { $ref: '#/components/schemas/Scalar' } } } } }
    PluginManifest:
      type: object
      required: [type, label, roles]
      properties:
        type: { type: string, pattern: '^[a-z][a-z0-9-]{2,40}$' }
        label: { type: string, maxLength: 60 }
        icon: { type: string, description: SVG path data for a 24 × 24 box }
        description: { type: string }
        version: { type: string }
        author: { type: string }
        roles:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: object, required: [name], properties: { name: { type: string, enum: [category, values] }, label: { type: string }, kind: { type: string, enum: [grouping, measure] }, min: { type: integer }, max: { type: integer } } }
    PluginVisual:
      allOf:
        - $ref: '#/components/schemas/PluginManifest'
        - type: object
          properties:
            source: { type: string, enum: [catalog, imported] }
            installedAt: { type: string, format: date-time }

    SemanticModel:
      type: object
      required: [id, name, tables, relationships, measures]
      properties:
        id: { type: integer }
        name: { type: string }
        tables: { type: array, items: { $ref: '#/components/schemas/Table' } }
        relationships: { type: array, items: { $ref: '#/components/schemas/Relationship' } }
        measures: { type: array, items: { $ref: '#/components/schemas/Measure' } }
        datasetFilters: { type: array, items: { $ref: '#/components/schemas/BiFilter' }, description: Applied by the server to every query on the model (I10) }
    Table:
      type: object
      required: [name, rowCount, columns]
      properties:
        name: { type: string }
        rowCount: { type: integer }
        hidden: { type: boolean }
        columns: { type: array, items: { $ref: '#/components/schemas/Column' } }
    Column:
      type: object
      required: [name, dataType]
      properties:
        name: { type: string }
        dataType: { $ref: '#/components/schemas/DataType' }
        hidden: { type: boolean }
        sortBy: { type: string, description: Column in the same table that orders this one }
        format: { type: string }
        expression: { type: string, description: 'Calculated columns: the row formula; dataType is inferred from it' }
        id: { type: [integer, 'null'] }
        origin: { type: string, enum: [model, user] }
        expressionError: { type: string, description: Set when a calculated column's formula no longer compiles }
    Relationship:
      type: object
      description: Many-to-one, single cross-filter direction (filters flow from toTable to fromTable)
      required: [fromTable, fromColumn, toTable, toColumn]
      properties:
        fromTable: { type: string }
        fromColumn: { type: string }
        toTable: { type: string }
        toColumn: { type: string }
        source: { type: string, enum: [foreignKey, overlay] }
    Measure:
      type: object
      required: [name, table, expression, origin]
      properties:
        id: { type: [integer, 'null'] }
        name: { type: string }
        table: { type: string, description: Home table — its rows are what the measure aggregates }
        expression: { type: string }
        format: { type: string }
        origin: { type: string, enum: [model, user] }
    MeasureInput:
      type: object
      required: [table, name, expression]
      properties:
        table: { type: string }
        name: { type: string }
        expression: { type: string }
        format: { type: string }
    MeasureValidateRequest:
      type: object
      required: [modelId, table, expression]
      properties:
        modelId: { type: integer }
        table: { type: string }
        expression: { type: string }
        kind: { type: string, enum: [measure, column], default: measure, description: column checks a row formula }
        name: { type: string, description: "The draft's own name, so self-references are reported as cycles" }
    MeasureValidateResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        dataType: { $ref: '#/components/schemas/DataType' }
        dependencies: { type: array, items: { type: string } }
        error: { $ref: '#/components/schemas/Error' }

    FieldRef:
      type: object
      required: [table, column]
      properties:
        table: { type: string }
        column: { type: string }
    GroupField:
      allOf:
        - $ref: '#/components/schemas/FieldRef'
        - type: object
          properties:
            dateLevel: { type: string, enum: [year, quarter, month], description: Only for date columns }

    BiFilter:
      oneOf:
        - $ref: '#/components/schemas/BasicFilter'
        - $ref: '#/components/schemas/AdvancedFilter'
        - $ref: '#/components/schemas/RangeFilter'
        - $ref: '#/components/schemas/RelativeDateFilter'
        - $ref: '#/components/schemas/RelativeTimeFilter'
        - $ref: '#/components/schemas/TopNFilter'
      discriminator: { propertyName: kind }
    FilterBase:
      type: object
      required: [kind, target]
      properties:
        id: { type: string }
        kind: { type: string }
        target: { $ref: '#/components/schemas/FieldRef' }
        scope: { type: string, enum: [report, page, visual], description: Client bookkeeping; servers ignore it }
    BasicFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          required: [operator, values]
          properties:
            kind: { const: basic }
            operator: { type: string, enum: [in, notIn] }
            values: { type: array, items: { $ref: '#/components/schemas/Scalar' }, description: null means (Blank) }
    AdvancedFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          required: [logic, conditions]
          properties:
            kind: { const: advanced }
            logic: { type: string, enum: [and, or] }
            conditions:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: object
                required: [operator]
                properties:
                  operator: { type: string, enum: [eq, ne, gt, gte, lt, lte, contains, notContains, startsWith, isBlank, isNotBlank] }
                  value: { $ref: '#/components/schemas/Scalar' }
    RangeFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          properties:
            kind: { const: range }
            min: { $ref: '#/components/schemas/Scalar' }
            max: { $ref: '#/components/schemas/Scalar' }
    RelativeDateFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          required: [period, count, unit]
          properties:
            kind: { const: relativeDate }
            period: { type: string, enum: [last, this, next], description: '"last 3 months" includes today unless includeToday is false' }
            count: { type: integer, minimum: 1, maximum: 1000 }
            unit: { type: string, enum: [day, week, month, quarter, year], description: Weeks run Monday to Sunday }
            includeToday: { type: boolean, default: true, description: '"last 1 day" with includeToday false is Yesterday' }
    RelativeTimeFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          required: [period, count, unit]
          properties:
            kind: { const: relativeTime }
            period: { type: string, enum: [last, next] }
            count: { type: integer, minimum: 1, maximum: 100000 }
            unit: { type: string, enum: [minute, hour], description: Measured from the request time; date-time columns only }
    TopNFilter:
      allOf:
        - $ref: '#/components/schemas/FilterBase'
        - type: object
          required: [n, by, direction]
          properties:
            kind: { const: topN }
            n: { type: integer, minimum: 1 }
            by: { type: string, description: 'Measure name, evaluated under the other filters' }
            direction: { type: string, enum: [top, bottom] }

    VisualQuery:
      type: object
      required: [modelId, groupBy, measures, filters]
      properties:
        modelId: { type: integer }
        groupBy: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/GroupField' } }
        measures: { type: array, minItems: 1, items: { type: string } }
        filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
        highlight: { type: array, items: { $ref: '#/components/schemas/BiFilter' }, description: 'When present, each row also returns highlighted measure values' }
        orderBy:
          type: object
          properties:
            by: { type: string, enum: [category, measure] }
            index: { type: integer, description: Measure index when by = measure }
            direction: { type: string, enum: [asc, desc] }
        limit: { type: integer, maximum: 5000 }
        asOf: { type: string, format: date, description: '"Today" for relative date filters' }
    QueryResult:
      type: object
      required: [columns, rows, truncated, ignoredFilters]
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              role: { type: string, enum: [group, measure] }
              dataType: { $ref: '#/components/schemas/DataType' }
              format: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [keys, values]
            properties:
              keys: { type: array, items: { $ref: '#/components/schemas/Scalar' } }
              values: { type: array, items: { $ref: '#/components/schemas/Scalar' }, description: 'Numbers, or text / true-false / dates for measures of those types (see columns[].dataType)' }
              highlights: { type: [array, 'null'], items: { $ref: '#/components/schemas/Scalar' } }
        truncated: { type: boolean }
        ignoredFilters: { type: array, items: { type: integer }, description: Indexes into filters that could not apply }

    RowsRequest:
      type: object
      required: [modelId, filters]
      properties:
        modelId: { type: integer }
        table: { type: string, description: Base table when columns is omitted (all visible columns) }
        columns: { type: array, items: { $ref: '#/components/schemas/FieldRef' } }
        filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, maximum: 1000 }
        asOf: { type: string, format: date }
    RowsResult:
      type: object
      required: [columns, rows, total, ignoredFilters]
      properties:
        columns: { type: array, items: { type: object, properties: { table: { type: string }, name: { type: string }, dataType: { $ref: '#/components/schemas/DataType' } } } }
        rows: { type: array, items: { type: array, items: { $ref: '#/components/schemas/Scalar' } } }
        total: { type: integer }
        ignoredFilters: { type: array, items: { type: integer } }

    ValuesRequest:
      type: object
      required: [modelId, target, filters]
      properties:
        modelId: { type: integer }
        target: { $ref: '#/components/schemas/FieldRef' }
        filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
        search: { type: string }
        limit: { type: integer, maximum: 500 }
        asOf: { type: string, format: date }
    ValuesResult:
      type: object
      required: [values, truncated]
      properties:
        values: { type: array, items: { $ref: '#/components/schemas/Scalar' } }
        truncated: { type: boolean }
        min: { $ref: '#/components/schemas/Scalar' }
        max: { $ref: '#/components/schemas/Scalar' }

    VisualDefinition:
      type: object
      required: [id, type, roles]
      properties:
        id: { type: string }
        type: { type: string, description: 'Registry type, e.g. column, bar, line, pie, donut, table, card, slicer, a host-registered type or an installed plug-in type' }
        title: { type: string }
        roles:
          type: object
          description: 'Data role → fields. Group roles hold GroupField; value roles hold { measure: name }.'
          additionalProperties:
            type: array
            items: { oneOf: [{ $ref: '#/components/schemas/GroupField' }, { type: object, required: [measure], properties: { measure: { type: string } } }] }
        filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
        interactions: { type: object, additionalProperties: { type: string, enum: [filter, highlight, none] }, description: 'Target visual id → how this visual''s selection affects it' }
        options: { type: object, additionalProperties: true, description: 'Slicers: mode (dropdown|list|between|relativeDate|relativeTime|boolean), singleSelect, defaultFilter (a BiFilter applied when the report opens)' }
        layout: { type: object, properties: { x: { type: integer }, y: { type: integer }, w: { type: integer }, h: { type: integer } } }
    PageDefinition:
      type: object
      required: [id, name, filters, visuals]
      properties:
        id: { type: string }
        name: { type: string }
        filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
        visuals: { type: array, items: { $ref: '#/components/schemas/VisualDefinition' } }
    ReportInput:
      type: object
      required: [name, modelId, definition]
      properties:
        name: { type: string }
        modelId: { type: integer }
        definition:
          type: object
          required: [filters, pages]
          properties:
            filters: { type: array, items: { $ref: '#/components/schemas/BiFilter' } }
            pages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PageDefinition' } }
            settings: { type: object, properties: { multiSelectWithoutCtrl: { type: boolean } } }
    ReportSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        modelId: { type: integer }
        updatedAt: { type: string, format: date-time }
    Report:
      allOf:
        - $ref: '#/components/schemas/ReportInput'
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    IngestRequest:
      type: object
      required: [tableName, records]
      properties:
        connectionId: { type: integer, description: Defaults to the JSON imports connection; the metadata database is refused }
        tableName: { type: string }
        records: { oneOf: [{ type: object }, { type: array, items: { type: object } }] }
        mode: { type: string, enum: [append, replace], default: append }
        dryRun: { type: boolean, default: false }
    IngestResult:
      type: object
      required: [connectionId, tables, written]
      properties:
        connectionId: { type: integer }
        written: { type: boolean }
        tables:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              parent: { type: [string, 'null'] }
              rowCount: { type: integer }
              columns: { type: array, items: { type: object, properties: { name: { type: string }, dataType: { $ref: '#/components/schemas/DataType' } } } }
              addedColumns: { type: array, items: { type: string } }
              sample: { type: array, items: { type: object } }
