openapi: 3.0.3
info:
  title: Al Tasnim BI Platform API
  version: "1.0.0"
  description: |
    Contract for the BI platform's backend-for-frontend (BFF). This spec is the
    single source of truth for a re-implementation in any language — the
    reference implementation happens to be Node/Express + SQLite, but nothing
    here is Node-specific. A .NET (or any other) implementation is a drop-in
    replacement for the Angular frontend as long as it satisfies this contract
    exactly: same routes, same request/response shapes, same error envelope.

    ## The one invariant that must survive porting

    Every endpoint that touches a `connectionId`/`table`/`column` MUST resolve
    those identifiers against the *live* schema of that specific connection
    before using them in any query — never against a hardcoded table list,
    and never by interpolating client-supplied text into SQL. Filter *values*
    are always bound parameters, never concatenated. This is the single
    security control the whole platform depends on ("the metadata-validation
    gate"). It is expressed here as a **shared precondition**, not per-endpoint
    boilerplate — see `x-invariant` on the relevant schemas and operations.

    A conforming re-implementation may satisfy this however fits the host
    stack (e.g. ADO.NET `DbConnection.GetSchema()`, EF Core model metadata,
    `INFORMATION_SCHEMA` queries) — the mechanism is free to change; the
    guarantee it provides may not.

    ## What is and isn't in scope here

    Three of the six BI features this API backs (the DAX-like formula editor,
    custom visual rendering, and cross-filtering) run entirely client-side in
    the Angular app and never call this API beyond the generic query/schema
    endpoints below — there is nothing feature-specific to port for them.
    Connectivity, ingestion, and filter-value discovery are the three features
    with real server-side surface, and that surface is exactly this document.

  contact:
    name: Al Tasnim BI Prototype
externalDocs:
  description: Companion human-readable reference (architecture + this contract, one page)
  url: ../diagrams/architecture-and-api-contract.html

servers:
  - url: http://localhost:4173/api
    description: Reference implementation (Node/Express + SQLite)
  - url: /api
    description: Any conforming implementation, same relative path

tags:
  - name: Connections
    description: Feature 01 — data source registry, schema introspection, filter-value discovery
  - name: Ingestion
    description: Feature 02 — flattened JSON/file rows into a real queryable table
  - name: Measures
    description: Feature 03 support — persistence for saved formulas (the formula *evaluation* itself is client-side)
  - name: Query
    description: The shared query engine every chart (features 04/05/06) runs against
  - name: Dashboards
    description: Dashboard and chart CRUD backing features 04/05/06 on the canvas

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [Connections]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, example: true } }
                required: [ok]

  # --- Connections --------------------------------------------------------

  /connections:
    get:
      operationId: listConnections
      summary: List every registered connection, with its live table list
      description: |
        For each connection, the implementation must attempt to enumerate its
        queryable tables live (e.g. `PRAGMA table_info` / `INFORMATION_SCHEMA`)
        and row counts, and report `status: "error"` with the failure message
        rather than omitting the connection or throwing, if introspection
        fails for one connection — other connections must still be returned.
      tags: [Connections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectionInfo" }
                required: [connections]
    post:
      operationId: createConnection
      summary: Register a new connection
      description: |
        `fileName` (or, in a non-SQLite implementation, whatever identifies
        the physical source) MUST be resolved against a fixed, server-known
        allow-list of available sources — never an arbitrary client-supplied
        path or connection string. `secret`, if provided, is encrypted at
        rest and never echoed back by any endpoint, including this one's
        response and `GET /connections`.
      tags: [Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "Sales (Software Co.)" }
                fileName: { type: string, example: "sales.db" }
                secret:
                  type: string
                  nullable: true
                  description: Credential/connection secret, encrypted at rest; write-only.
              required: [name, fileName]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer } }
                required: [id]
        "400": { $ref: "#/components/responses/BadRequest" }

  /connections/available-files:
    get:
      operationId: listAvailableFiles
      summary: List sources known to the server but not yet registered as a connection
      description: |
        The reference implementation lists `.db` files in a fixed local
        directory not already in use. A non-file-based implementation
        returns whatever its equivalent "known but unregistered sources"
        concept is (e.g. configured-but-unbound connection strings).
      tags: [Connections]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { type: string } }
                required: [files]

  /connections/{id}:
    delete:
      operationId: deleteConnection
      summary: Remove a connection
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: The built-in default connection cannot be removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /connections/{id}/tables/{table}/schema:
    get:
      operationId: getTableSchema
      summary: Live column list for one table on one connection
      description: |
        x-invariant: `table` MUST be checked against this connection's live,
        queryable table list before this query runs — an unknown table is a
        400, never a query attempt.
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/Table"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  table: { type: string }
                  columns:
                    type: array
                    items: { $ref: "#/components/schemas/ColumnInfo" }
                required: [table, columns]
        "400": { $ref: "#/components/responses/BadRequest" }

  /connections/{id}/tables/{table}/columns/{column}/distinct:
    get:
      operationId: getColumnDistinctValues
      summary: Distinct non-null values of one column (backs the text-filter dropdown)
      description: |
        x-invariant: `column` MUST be validated against this table's live
        schema (same gate as every other identifier in this API) before use.
        Capped at 200 values — this is a filter-value picker, not a full
        column dump.
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf: [{ type: string }, { type: number }]
                required: [values]
        "400": { $ref: "#/components/responses/BadRequest" }

  /connections/{id}/tables/{table}/columns/{column}/range:
    get:
      operationId: getColumnRange
      summary: Min/max of one column (backs the number-slider and date-picker filters)
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/Table"
        - $ref: "#/components/parameters/Column"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  min: { oneOf: [{ type: number }, { type: string }] }
                  max: { oneOf: [{ type: number }, { type: string }] }
                required: [min, max]
        "400": { $ref: "#/components/responses/BadRequest" }

  /connections/{id}/tables/{table}/preview:
    get:
      operationId: previewTable
      summary: First 8 rows of a table, unfiltered
      tags: [Connections]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
        - $ref: "#/components/parameters/Table"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { type: object, additionalProperties: true }
                required: [rows]
        "400": { $ref: "#/components/responses/BadRequest" }

  # --- Ingestion ------------------------------------------------------------

  /ingest:
    post:
      operationId: ingestRows
      summary: Turn flattened rows into a real, queryable table
      description: |
        The reference implementation `CREATE TABLE IF NOT EXISTS` per upload,
        naming it from a sanitized `tableName`, with every row/column key run
        through the same identifier sanitizer used everywhere else (strip to
        `[a-zA-Z0-9_]`, reject empty, cap length) — never a raw client string
        used as a SQL identifier.

        **Porting note:** dynamic `CREATE TABLE` per upload is easy against a
        disposable SQLite file; it is usually the wrong design against a
        governed production database (DDL typically needs review/approval).
        A more portable equivalent lands rows in one fixed staging table with
        a JSON/NVARCHAR(MAX) column instead of creating a table per upload —
        the request/response shape here does not need to change either way.
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: integer, default: 1 }
                tableName: { type: string, example: "web_orders" }
                rows:
                  type: array
                  minItems: 1
                  items: { type: object, additionalProperties: true }
              required: [tableName, rows]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /raw-events:
    get:
      operationId: listRawEvents
      summary: Seeded demo JSON payloads shown in the JSON Explorer's "Events" tab
      tags: [Ingestion]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RawEvent" }
                required: [events]

  # --- Measures ---------------------------------------------------------------

  /measures:
    get:
      operationId: listMeasures
      summary: List saved measures (reusable named QueryConfigs)
      tags: [Measures]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  measures:
                    type: array
                    items: { $ref: "#/components/schemas/SavedMeasure" }
                required: [measures]
    post:
      operationId: createMeasure
      summary: Save a named QueryConfig
      description: |
        `config` MUST pass the same validation the query engine itself
        applies (see `POST /query`) before being persisted — never save an
        unvalidated config that would fail at run time.
      tags: [Measures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { $ref: "#/components/schemas/QueryConfig" }
              required: [name, config]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer } }
                required: [id]
        "400": { $ref: "#/components/responses/BadRequest" }

  /measures/{id}:
    delete:
      operationId: deleteMeasure
      summary: Delete a saved measure
      tags: [Measures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # --- Query engine -----------------------------------------------------------

  /query:
    post:
      operationId: runQuery
      summary: Run an aggregate query (the engine behind every bar/line/pie chart)
      description: |
        x-invariant: `table`, `groupBy`, every filter's `field`, and the
        metric's field(s) MUST each be validated against the connection's
        live schema before being used to build the query; the aggregation
        function and filter operator MUST be checked against a fixed
        allow-list (`SUM|AVG|COUNT|MIN|MAX`, `=|!=|>|<|>=|<=`); every filter
        *value* MUST be a bound parameter, never concatenated into SQL text.

        If `join` is present, the implementation joins `table` (on the
        primary connection) to `join.table` (on `join.connectionId`) via
        `join.leftField = join.rightField`. **Porting note:** the reference
        implementation only supports this because both connections happen to
        be SQLite files in the same process (`ATTACH DATABASE`) — a real
        heterogeneous join (e.g. SQL Server ⋈ a separate system) generally
        cannot be pushed down as one query and needs either a same-engine
        `JOIN`, a federation layer, or an application-side merge of two
        separate result sets. The request/response shape is unaffected by
        which of those an implementation chooses.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /drilldown:
    post:
      operationId: drilldown
      summary: The individual rows behind one aggregate value, or a full detail-table view
      description: |
        Powers both the "see records" right-click on a bar/pie/line chart
        (pass `groupBy` + `groupValue`) and the Table visual, which wants
        every filtered detail row with no aggregation (omit `groupBy`).
        Same identifier-validation and bound-parameter rules as `POST
        /query`. Capped at 50 rows — this is a preview/drill surface, not an
        export endpoint.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: integer, default: 1 }
                table: { type: string }
                groupBy: { type: string, nullable: true }
                groupValue:
                  nullable: true
                  oneOf: [{ type: string }, { type: number }]
                filters:
                  type: array
                  items: { $ref: "#/components/schemas/QueryFilter" }
                  default: []
              required: [table]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sql: { type: string, description: "Echoed for debugging/demo transparency; not required of a port." }
                  params: { type: array, items: {} }
                  rows:
                    type: array
                    items: { type: object, additionalProperties: true }
                required: [sql, params, rows]
        "400": { $ref: "#/components/responses/BadRequest" }

  # --- Dashboards ---------------------------------------------------------------

  /dashboards:
    get:
      operationId: listDashboards
      tags: [Dashboards]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboards:
                    type: array
                    items: { $ref: "#/components/schemas/DashboardInfo" }
                required: [dashboards]
    post:
      operationId: createDashboard
      tags: [Dashboards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string } }
              required: [name]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer } }
                required: [id]
        "400": { $ref: "#/components/responses/BadRequest" }

  /dashboards/{id}:
    patch:
      operationId: renameDashboard
      summary: Rename a dashboard
      tags: [Dashboards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string } }
              required: [name]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDashboard
      tags: [Dashboards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: The default dashboard cannot be removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dashboards/{id}/charts:
    get:
      operationId: listDashboardCharts
      tags: [Dashboards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  charts:
                    type: array
                    items: { $ref: "#/components/schemas/DashboardChart" }
                required: [charts]
    post:
      operationId: addDashboardChart
      summary: Add a chart to a dashboard
      description: |
        `config` MUST pass the same validation as `POST /query` before being
        persisted (the reference implementation literally re-runs its query
        builder against it and discards the SQL, purely for validation).
      tags: [Dashboards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                chartType: { $ref: "#/components/schemas/ChartType" }
                config: { $ref: "#/components/schemas/QueryConfig" }
              required: [title, chartType, config]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: integer } }
                required: [id]
        "400": { $ref: "#/components/responses/BadRequest" }

  /dashboards/{dashboardId}/charts/{chartId}:
    patch:
      operationId: updateDashboardChart
      summary: Partially update a chart — title only (inline rename) or full config (edit-query flow)
      description: |
        Every field is optional; an omitted field keeps its current value. A
        supplied `config` is re-validated exactly as on create.
      tags: [Dashboards]
      parameters:
        - $ref: "#/components/parameters/DashboardId"
        - $ref: "#/components/parameters/ChartId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                chartType: { $ref: "#/components/schemas/ChartType" }
                config: { $ref: "#/components/schemas/QueryConfig" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDashboardChart
      tags: [Dashboards]
      parameters:
        - $ref: "#/components/parameters/DashboardId"
        - $ref: "#/components/parameters/ChartId"
      responses:
        "200": { $ref: "#/components/responses/Ok" }

components:
  parameters:
    ConnectionId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Connection id (note the reference implementation's routes name this path segment `id`, not `connectionId`).
    Table:
      name: table
      in: path
      required: true
      schema: { type: string }
    Column:
      name: column
      in: path
      required: true
      schema: { type: string }
    DashboardId:
      name: dashboardId
      in: path
      required: true
      schema: { type: integer }
    ChartId:
      name: chartId
      in: path
      required: true
      schema: { type: integer }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean, example: true } }
            required: [ok]
    BadRequest:
      description: |
        Validation failure — including every metadata-gate rejection (unknown
        connection/table/column, disallowed aggregation or operator). Never a
        query attempt on unvalidated input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The referenced resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      description: Uniform error envelope for every non-2xx response across this entire API.
      properties:
        error: { type: string, example: 'Unknown table "widgets" on connection 1' }
      required: [error]

    ColumnInfo:
      type: object
      properties:
        name: { type: string }
        type:
          type: string
          description: Native column type as reported by the source (e.g. SQLite affinity, or a .NET provider's type name). The frontend classifies text/number/date from this plus the column name — see column-type.ts.
      required: [name, type]

    TableInfo:
      type: object
      properties:
        name: { type: string }
        rowCount: { type: integer }
      required: [name, rowCount]

    ConnectionInfo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        fileName:
          type: string
          description: Reference-implementation-specific (the SQLite file name). A non-file-based implementation may repurpose this field for whatever identifies the physical source, or add a parallel field — the Angular app only displays it, never parses it.
        driver: { type: string, example: "node:sqlite" }
        status: { type: string, enum: [connected, error] }
        createdAt: { type: string, format: date-time }
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableInfo" }
        error: { type: string, nullable: true }
      required: [id, name, fileName, driver, status, createdAt, tables, error]

    AggFn:
      type: string
      enum: [SUM, AVG, COUNT, MIN, MAX]

    FilterOp:
      type: string
      enum: ["=", "!=", ">", "<", ">=", "<="]

    QueryFilter:
      type: object
      properties:
        field: { type: string }
        op: { $ref: "#/components/schemas/FilterOp" }
        value:
          type: string
          description: Always bound as a parameter server-side, whatever the underlying column type — the client always sends a string.
      required: [field, op, value]

    Metric:
      oneOf:
        - type: object
          properties:
            type: { type: string, enum: [agg] }
            agg: { $ref: "#/components/schemas/AggFn" }
            field: { type: string }
          required: [type, agg, field]
        - type: object
          properties:
            type: { type: string, enum: [ratio] }
            agg: { $ref: "#/components/schemas/AggFn" }
            numerator: { type: string }
            denominator: { type: string }
          required: [type, agg, numerator, denominator]
      discriminator:
        propertyName: type

    QueryJoin:
      type: object
      properties:
        connectionId: { type: integer }
        table: { type: string }
        leftField:
          type: string
          description: Column on the primary query's table.
        rightField:
          type: string
          description: Column on the joined table.
      required: [connectionId, table, leftField, rightField]

    QueryConfig:
      type: object
      properties:
        connectionId: { type: integer }
        table: { type: string }
        groupBy: { type: string, nullable: true }
        filters:
          type: array
          items: { $ref: "#/components/schemas/QueryFilter" }
        metric: { $ref: "#/components/schemas/Metric" }
        join:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/QueryJoin" }]
      required: [connectionId, table, groupBy, filters, metric]

    QueryResultRow:
      type: object
      properties:
        group_key:
          nullable: true
          oneOf: [{ type: string }, { type: number }]
        value: { type: number, nullable: true }
      required: [value]

    QueryResult:
      type: object
      properties:
        sql:
          type: string
          description: Echoed for debugging/demo transparency (shown in the Query Builder's "Generated SQL" panel). Not a contractual requirement of a port — the Angular app tolerates any non-empty string here — but if omitted, remove or stub that panel.
        params: { type: array, items: {} }
        rows:
          type: array
          items: { $ref: "#/components/schemas/QueryResultRow" }
      required: [sql, params, rows]

    SavedMeasure:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        config: { $ref: "#/components/schemas/QueryConfig" }
      required: [id, name, createdAt, config]

    RawEvent:
      type: object
      properties:
        id: { type: integer }
        source: { type: string }
        receivedAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
      required: [id, source, receivedAt, payload]

    IngestResult:
      type: object
      properties:
        connectionId: { type: integer }
        table: { type: string }
        rowCount: { type: integer }
        columns: { type: array, items: { type: string } }
      required: [connectionId, table, rowCount, columns]

    DashboardInfo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, createdAt]

    ChartType:
      type: string
      enum: [bar, line, pie, table]

    DashboardChart:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        chartType: { $ref: "#/components/schemas/ChartType" }
        config: { $ref: "#/components/schemas/QueryConfig" }
        position: { type: integer }
      required: [id, title, chartType, config, position]
