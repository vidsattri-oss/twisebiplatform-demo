<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Sources — Tasnim Maps</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="shell-root"></div>
<script src="/shell.js"></script>
<script>
renderShell('sources', 'Query Builder <span class="dim">&gt;</span> Data Sources');

const svgDb = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>';
const svgTable = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18M9 4v16"/></svg>';
const svgChevron = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
const svgCheck = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
const svgRefresh = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11A8 8 0 0 0 6.1 6.1M4 13a8 8 0 0 0 13.9 4.9"/><path d="M20 5v5h-5M4 19v-5h5"/></svg>';

async function load() {
  const content = document.getElementById('page-content');
  content.innerHTML = '<div class="empty-note">Loading data sources&hellip;</div>';
  let data;
  try {
    const res = await fetch('/api/sources');
    if (!res.ok) throw new Error('request failed');
    data = await res.json();
  } catch (e) {
    content.innerHTML = '<div class="status-msg err">Could not reach the local backend. Is the server running (npm start)?</div>';
    return;
  }

  content.innerHTML = `
    <div class="page-head">
      ${'<div class="page-icon">' + svgDb + '</div>'}
      <div><div class="page-title">Data Sources</div><div class="page-sub">Configured connections available to the Query Builder</div></div>
      <div class="head-spacer"></div>
      <button class="btn" id="test-btn">${svgRefresh} Test Connection</button>
    </div>

    <div class="card conn-card">
      <div class="conn-icon">${svgDb}</div>
      <div class="conn-body">
        <div class="conn-title">${data.name} <span style="font-weight:500;color:#8B93AC;font-size:12px;">(${data.driver})</span></div>
        <div class="conn-meta">${data.file}</div>
      </div>
      <div class="conn-status">${svgCheck} Connected</div>
    </div>

    <div class="card card-pad">
      <div class="field-label" style="margin-bottom:12px;">Tables (${data.tables.length})</div>
      <div class="table-list" id="table-list"></div>
    </div>
  `;

  const list = document.getElementById('table-list');
  data.tables.forEach((t) => {
    const row = document.createElement('div');
    row.className = 'table-row';
    row.innerHTML = `
      <div class="table-row-head">
        <div class="table-icon">${svgTable}</div>
        <div class="table-name">${t.name}</div>
        <div class="table-count">${t.rowCount} rows</div>
        ${svgChevron}
      </div>
      <div class="table-detail">
        <div class="field-label" style="margin:10px 0 6px;">Columns</div>
        <div class="col-chip-row">
          ${t.columns.map((c) => `<span class="col-chip">${c.name}<span class="t">${c.type}</span></span>`).join('')}
        </div>
        <div class="field-label" style="margin-bottom:6px;">Preview</div>
        <div class="preview-holder" data-table="${t.name}"><div class="empty-note">Expand to load a preview&hellip;</div></div>
      </div>
    `;
    row.querySelector('.table-row-head').addEventListener('click', async () => {
      const wasOpen = row.classList.contains('open');
      row.classList.toggle('open');
      if (!wasOpen) {
        const holder = row.querySelector('.preview-holder');
        if (holder.dataset.loaded) return;
        const res = await fetch(`/api/tables/${t.name}/preview`);
        const { rows } = await res.json();
        if (!rows.length) { holder.innerHTML = '<div class="empty-note">No rows.</div>'; return; }
        const cols = Object.keys(rows[0]);
        holder.innerHTML = `<table class="preview-table"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        holder.dataset.loaded = '1';
      }
    });
    list.appendChild(row);
  });

  document.getElementById('test-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Testing&hellip;';
    try {
      await fetch('/api/health');
      btn.innerHTML = svgCheck + ' Connection OK';
    } catch {
      btn.innerHTML = 'Failed';
    }
    setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1400);
  });
}

load();
</script>
</body>
</html>
